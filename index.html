<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment-2</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> 
<link href="https://fonts.googleapis.com/css2?family=Inter&family=Noto+Serif&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          inter: ['Inter', 'sans-serif'],
          'noto-serif': ['"Noto Serif"', 'serif'],
        }
      }
    }
  }
</script>
   
</head>
<body class="bg-[#f8f9fd] text-gray-800">
      
  <!-- Logo section-->
  <header class="bg-[#f5f7fe] py-6">
  <div class="max-w-[1140px] mx-auto flex justify-between items-center px-4">
   
    <div>
      <img src="images/assets/logo.png" alt="Logo" class="h-8" />
    </div>
  <div class="flex items-center space-x-8">
    <!-- for hidden on mobile-->
    <div class="hidden md:flex space-x-8 text-sm font-['Inter'] text-gray-400">
      <a href="#" class="font-semibold text-black">Home</a>
      <a href="#">Shop</a>
      <a href="#">About us</a>
    </div>
    <!-- Cart -->
    <div class="flex items-center space-x-2">
      <img src="images/assets/shopping-cart.png" alt="Cart" class="h-5 w-5" />
      <span class="text-sm font-['Inter'] text-black">Cart ($56)</span>
    </div>
  </div>
  </div>
</header>
<main>

    <!-- Fresh Flower section -->
   <section class=" relative bg-[#f6f8ff] py-[120px] max-w-[1140px] mx-auto  flex items-center justify-between gap-12 max-[768px]:flex-col-reverse">
  
    <div class="w-1/2 max-[768px]:w-full  px-4 text-left max-[768px]:text-center">
      <h2 class="text-[56px] font-bold font-['Noto_Serif'] leading-tight text-black max-[768px]:text-[32px] max-[768px]:text-left">
        ALWAYS <span class="text-orange-600">FRESH FLOWERS</span>
      </h2>
      <p class="mt-6 text-base text-gray-400 font-['Inter'] max-w-md max-[768px]:text-sm max-[768px]:text-left max-[768px]:mx-auto">
        Indulge your senses with the beauty and fragrance of our fresh flower shop. From classic roses to exotic blooms, we offer a wide variety of fresh flowers that are perfect for any occasion.
      </p>
    </div>

    <div class=" w-1/2 max-[768px]:w-full">
  <img src="images/assets/hero-flower.png" alt="Flowers" class="h-full w-full object-contain" />
</div>
</section>

</main>
<footer>

</footer>
